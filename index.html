    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            colors: {
              background: '#0f0a15', // Deep Purple/Black
              surface: '#1e1b2e',    // Dark Purple Surface
              primary: '#fbbf24',    // Honey Yellow (Primary Action)
              primaryHover: '#d97706', 
              accent: '#a855f7',     // Purple (Accent)
              honey: '#fbbf24',      // Honeybear (Yellow)
              bean: '#a855f7',       // Jellybean (Purple)
              bear: '#451a03',       // Deep Bear Brown
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f0a15;
        background-image: 
          radial-gradient(at 0% 0%, rgba(251, 191, 36, 0.08) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
        color: #fff;
        min-height: 100vh;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a855f7;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9333ea;
      }
    </style>
